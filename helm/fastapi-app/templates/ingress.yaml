{{- if .Values.ingress.enabled -}}
{{- $fullName := include "fastapi-app.fullname" . -}}
# k3s ships Traefik as its ingress controller, so this is the same reverse proxy
# as the Docker Compose setup, driven by a Kubernetes object instead of
# container labels.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "fastapi-app.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    # Asks cert-manager to obtain a certificate for the hosts listed under tls
    # below and put it in the named Secret. Traefik then serves it.
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.issuer | quote }}
    # Sends plain HTTP to HTTPS. The middleware is referenced by
    # <namespace>-<name>@kubernetescrd, which is how Traefik names resources it
    # picked up from Kubernetes.
    traefik.ingress.kubernetes.io/router.middlewares: >-
      {{ .Release.Namespace }}-{{ $fullName }}-redirect-https@kubernetescrd
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $fullName }}-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
{{- end }}

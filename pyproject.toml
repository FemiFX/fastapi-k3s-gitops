[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: bugbear, UP: pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"
# Put the repository root on the import path so "from app.main import app"
# works. Without this, plain "pytest" fails while "python -m pytest" works,
# because only the latter adds the current directory to sys.path.
pythonpath = ["."]

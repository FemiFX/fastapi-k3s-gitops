[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
# Print task results as readable YAML instead of one long JSON line.
# The old 'yaml' callback plugin was removed; this option replaces it.
callback_result_format = yaml
# Show which tasks changed something at the end of a run.
display_skipped_hosts = False
retry_files_enabled = False

[ssh_connection]
# Reuse one SSH connection per host instead of opening a new one per task.
pipelining = True
# ssh_config holds the jump host settings and connection sharing. Run ansible
# from this directory so the relative path resolves.
ssh_args = -F ssh_config -o ControlMaster=auto -o ControlPersist=10m
# Retry a host once if the connection itself fails.
retries = 2
